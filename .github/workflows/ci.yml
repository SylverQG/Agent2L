name: CI  # 持续集成流水线

on:
  push:
    branches: [main]  # 推送 main 分支时触发
  pull_request:
    branches: [main]  # PR 到 main 分支时触发

jobs:
  lint:  # 代码风格检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 pip 依赖加速后续构建
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: 使用 ruff 进行代码检查
        run: ruff check .

  test:  # 自动化测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r 2-projects/code-review-agent/requirements.txt
          pip install -r 2-projects/data-analysis-agent/requirements.txt
          pip install -r 2-projects/smart-customer-service-agent/requirements.txt
          pip install -r 3-scaffold/requirements.txt
          pip install pytest

      - name: 运行测试
        run: |
          pytest 2-projects/code-review-agent/tests --tb=short
          pytest 2-projects/data-analysis-agent/tests --tb=short
          pytest 2-projects/smart-customer-service-agent/tests --tb=short
          pytest 3-scaffold/tests --tb=short

  build:  # Docker 镜像构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 Docker 镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agent-course:latest