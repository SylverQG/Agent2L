[tool.ruff]
target-version = "py311"

# 排除 Notebook 文件和虚拟环境
exclude = [
    "*.ipynb",
    "1-jupyternotebook/",
    ".ipynb_checkpoints/",
    "venv/",
    ".venv/",
    "__pycache__/",
    "node_modules/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"