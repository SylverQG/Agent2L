apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-course
  labels:
    app: agent-course
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-course
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70