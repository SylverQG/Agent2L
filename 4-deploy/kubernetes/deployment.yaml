apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-course
  labels:
    app: agent-course
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-course
  template:
    metadata:
      labels:
        app: agent-course
    spec:
      containers:
        - name: agent-course
          image: agent-course:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-course-secret
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-course-secret
                  key: ANTHROPIC_API_KEY
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "0.5"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /workspace
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent-course-data