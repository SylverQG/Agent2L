apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-course

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
  - hpa.yaml

configMapGenerator:
  - name: agent-course-config
    literals:
      - APP_ENV=production

secretGenerator:
  - name: agent-course-secret
    type: Opaque
    literals:
      - OPENAI_API_KEY=placeholder
      - ANTHROPIC_API_KEY=placeholder